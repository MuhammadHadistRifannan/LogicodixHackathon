<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' ws: wss:; style-src 'self' https://fonts.googleapis.com; script-src 'self'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self';"
    />
    <meta name="theme-color" content="#0a0c0f" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Logicodix</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="select" id="select">
      <div class="select-backdrop" aria-hidden="true"></div>
      <div class="scene" id="scene" aria-hidden="true"></div>

      <button class="music-toggle" id="musicToggle" type="button" aria-label="Matikan musik" title="Musik">
        <span class="music-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </button>

      <section class="stage" aria-live="polite">
        <div class="stage-art" id="stageArt"></div>
      </section>

      <header class="identity" aria-live="polite">
        <p class="identity-name" id="identityName"></p>
        <p class="identity-epithet" id="identityEpithet"></p>
        <p class="identity-lore" id="identityLore"></p>
      </header>

      <div class="roster-panel">
        <nav class="roster" id="roster" aria-label="Daftar karakter"></nav>
        <h1 class="roster-title">Pilih karakter</h1>
      </div>
    </main>

    <script type="module" src="/client/main.js"></script>
  </body>
</html>
